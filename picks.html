<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Family Pick'em</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='6' width='20' height='20' rx='3' fill='%23C99A06' transform='rotate(-8 16 16)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F2F4F1; --panel:#FFFFFF; --ink:#16211C; --muted:#5E6B64; --rule:#D9DFDA;
  --accent:#C99A06; --accent-soft:#FBF1CC; --pos:#1D7A4C; --pos-soft:#E1F2E8; --neg:#B23A2E;
  --f-display:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101613; --panel:#18201C; --ink:#E6ECE8; --muted:#97A39C; --rule:#2B3530;
  --accent:#E8BC2A; --accent-soft:#3A3113; --pos:#5CC48D; --pos-soft:#173226; --neg:#F07A6C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101613; --panel:#18201C; --ink:#E6ECE8; --muted:#97A39C; --rule:#2B3530;
  --accent:#E8BC2A; --accent-soft:#3A3113; --pos:#5CC48D; --pos-soft:#173226; --neg:#F07A6C; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
.app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:max(16px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.brand{font:500 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.brand i{display:inline-block;width:12px;height:12px;background:var(--accent);transform:rotate(-8deg);border-radius:2px;margin-right:7px;vertical-align:-1px}
.prog{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin-bottom:6px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.count{font:500 12.5px var(--f-mono);color:var(--muted);margin-bottom:18px}
h1,h2{font-family:var(--f-display);font-weight:700;margin:0;line-height:1.02}
h1{font-size:40px}
h2{font-size:44px;text-align:center}
h2 .at{color:var(--muted);font-weight:600;font-size:30px;margin:0 6px}
.lead{color:var(--muted);margin:10px 0 0}
.card{flex:1;display:flex;flex-direction:column;gap:18px}
.when{text-align:center;color:var(--muted);font-size:14px;margin:6px 0 0}
.q{display:grid;gap:10px}
.q .lbl{font:500 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{font:600 20px var(--f-body);font-variant-numeric:tabular-nums;min-height:72px;padding:10px;border-radius:14px;border:2px solid var(--rule);background:var(--panel);color:var(--ink);cursor:pointer;display:grid;gap:2px;place-content:center;-webkit-tap-highlight-color:transparent}
.opt small{font:500 12px var(--f-body);color:var(--muted)}
.opt[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.opt[aria-pressed="true"] small{color:var(--bg);opacity:.75}
.opt:focus-visible,.btn:focus-visible,.link:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:auto;padding-top:18px}
.btn{font:600 16px var(--f-body);min-height:52px;padding:0 22px;border-radius:12px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn:disabled{opacity:.35;cursor:default}
.btn.wide{width:100%}
.saved{font-size:13px;color:var(--muted);text-align:center;min-height:19px}
.saved.ok{color:var(--pos)} .saved.bad{color:var(--neg)}
.review{display:grid;gap:8px;margin:16px 0}
.rv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:10px 12px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;width:100%}
.rv b{font-family:var(--f-display);font-size:20px}
.rv span{font-size:14px;color:var(--muted)}
.rv em{font-style:normal;font:600 14px var(--f-body);text-align:right;grid-row:1/3;grid-column:2}
.rv.miss em{color:var(--neg)}
.rv.locked{cursor:default;opacity:.6}
.who{display:flex;gap:10px;margin-top:20px}
.who .btn{flex:1}
.link{color:var(--ink);font-weight:600}
.msg{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:14px;margin-top:14px}
.done-mark{width:64px;height:64px;border-radius:50%;background:var(--pos-soft);color:var(--pos);display:grid;place-items:center;font:700 34px var(--f-display);margin:8px 0 4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<main class="app" id="app" aria-live="polite"><p class="lead">Loading this week&#8217;s games&#8230;</p></main>
<script>
(function(){
const PLAYERS = ['Ronnie', 'Owen', 'Dad'];
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {get(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }};
const qs = new URLSearchParams(location.search);
let me = PLAYERS.find(p => p.toLowerCase() === String(qs.get('p') || store.get('pk_player') || '').toLowerCase()) || null;
if (me) store.set('pk_player', me);
const wParam = qs.get('w');

// kickoffs are US Eastern in the schedule feed
function koDate(s){
  const [d, t] = s.split(' '), [y, m, dd] = d.split('-').map(Number);
  const nov1 = new Date(Date.UTC(y, 10, 1)).getUTCDay(), firstSun = 1 + (7 - nov1) % 7;
  const mar1 = new Date(Date.UTC(y, 2, 1)).getUTCDay(), secondSun = 1 + (7 - mar1) % 7 + 7;
  const edt = (m > 3 && m < 11) || (m === 3 && dd >= secondSun) || (m === 11 && dd < firstSun);
  return new Date(`${d}T${t}:00${edt ? '-04:00' : '-05:00'}`);
}
const fmtKo = s => koDate(s).toLocaleString(undefined, {weekday: 'long', hour: 'numeric', minute: '2-digit'});
const started = e => Date.now() >= koDate(e.kickoff).getTime();
const num = v => v === 0 ? 'PK' : (v > 0 ? '+' : '−') + Math.abs(v);
// spread is the HOME team's expected margin: the home team's number is -spread, the away team's +spread
const side = (e, s) => s === 'home' ? `${e.home} ${num(-e.spread)}` : `${e.away} ${num(e.spread)}`;

let PK, wk, games = [], picks = {}, i = 0, mode = 'intro';
const mine = () => ((picks[`${wk}-${me}`] || {}).picks) || {};
const open = () => games.filter(([, e]) => !started(e));
const filled = (gid) => { const p = mine()[gid] || {}; return !!(p.s && p.t); };

function shell(inner, progress){
  const done = games.filter(([g, e]) => filled(g)).length;
  app.innerHTML = `<div class="top"><span class="brand"><i aria-hidden="true"></i>Family pick&#8217;em${PK ? ' · Week ' + (+wk.slice(5)) : ''}</span>${me ? `<span class="brand">${esc(me)}</span>` : ''}</div>` +
    (progress ? `<div class="prog" aria-hidden="true"><i style="width:${games.length ? 100 * done / games.length : 0}%"></i></div><div class="count">${done} of ${games.length} games picked</div>` : '') + inner;
}

function chooseWho(){
  shell(`<h1>Who&#8217;s picking?</h1><p class="lead">Tap your name. This phone will remember it.</p>
    <div class="who">${PLAYERS.map(p => `<button type="button" class="btn ghost" data-p="${p}">${p}</button>`).join('')}</div>`);
  app.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { me = b.dataset.p; store.set('pk_player', me); intro(); });
}

function intro(){
  mode = 'intro';
  const o = open(), left = o.filter(([g]) => !filled(g)).length;
  if (!o.length) { summary(); return; }
  if (!left) { summary(); return; }
  const first = games.findIndex(([g, e]) => !started(e) && !filled(g));
  shell(`<div class="card"><div><h1>Hi ${esc(me)}.</h1>
    <p class="lead">Week ${+wk.slice(5)}: ${o.length} game${o.length === 1 ? '' : 's'} to pick. For each one, take a side against the spread and pick over or under the total. It saves as you go, and you can change a pick until that game kicks off.</p></div>
    <div class="msg">Lines are frozen for the week, so everyone (the model too) picks against the same numbers.</div>
    <div class="nav"><button type="button" class="btn wide" id="go">${left === o.length * 1 && !Object.keys(mine()).length ? 'Start picking' : 'Pick up where you left off'}</button></div></div>`, true);
  document.getElementById('go').onclick = () => { i = first; game(); };
}

function game(){
  mode = 'game';
  // skip games that have kicked off since the page loaded
  while (i < games.length && started(games[i][1])) i++;
  if (i >= games.length) { summary(); return; }
  const [gid, e] = games[i], p = mine()[gid] || {};
  const opt = (k, v, big, small) => `<button type="button" class="opt" data-k="${k}" data-v="${v}" aria-pressed="${p[k] === v}">${esc(big)}${small ? `<small>${esc(small)}</small>` : ''}</button>`;
  const fav = e.spread === 0 ? '' : e.spread > 0 ? `${e.home} favored by ${Math.abs(e.spread)}` : `${e.away} favored by ${Math.abs(e.spread)}`;
  shell(`<div class="card">
      <div><h2>${esc(e.away)}<span class="at">@</span>${esc(e.home)}</h2><p class="when">${esc(fmtKo(e.kickoff))}${fav ? ' · ' + esc(fav) : ''}</p></div>
      <div class="q"><span class="lbl">Spread: who covers?</span><div class="opts">${opt('s', 'away', side(e, 'away'), e.away + ' (away)')}${opt('s', 'home', side(e, 'home'), e.home + ' (home)')}</div></div>
      <div class="q"><span class="lbl">Total points: ${e.total}</span><div class="opts">${opt('t', 'over', 'Over ' + e.total, 'more than ' + e.total)}${opt('t', 'under', 'Under ' + e.total, 'fewer than ' + e.total)}</div></div>
      <p class="saved" id="saved"></p>
      <div class="nav"><button type="button" class="btn ghost" id="back">Back</button><button type="button" class="btn" id="next"${p.s && p.t ? '' : ' disabled'}>${nextIdx() < 0 ? 'Review picks' : 'Next game'}</button></div>
    </div>`, true);
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(gid, e, b.dataset.k, b.dataset.v));
  document.getElementById('back').onclick = () => { const j = prevIdx(); if (j < 0) intro(); else { i = j; game(); } };
  document.getElementById('next').onclick = advance;
}
const nextIdx = () => { for (let j = i + 1; j < games.length; j++) if (!started(games[j][1])) return j; return -1; };
const prevIdx = () => { for (let j = i - 1; j >= 0; j--) if (!started(games[j][1])) return j; return -1; };
function advance(){ const j = nextIdx(); if (j < 0) summary(); else { i = j; game(); } }

let auto = null;
function choose(gid, e, k, v){
  if (started(e)) { game(); return; }
  const id = `${wk}-${me}`, rec = JSON.parse(JSON.stringify(picks[id] || {player: me, week: wk, picks: {}}));
  rec.picks[gid] = Object.assign({}, rec.picks[gid], {[k]: v, ['at_' + k]: new Date().toISOString()});
  const wasFull = filled(gid);
  picks[id] = rec;
  const cur = i; game();
  send({player: me, week: wk, gid, k, v, ko: koDate(e.kickoff).toISOString()});
  // both picks made for this game: move on to the next one after a beat (unless they were just changing a pick)
  clearTimeout(auto);
  if (filled(gid) && !wasFull) auto = setTimeout(() => { if (mode === 'game' && i === cur) advance(); }, 550);
}

const queue = []; let sending = false;
async function send(q){ queue.push(q); pump(); }
async function pump(){
  if (sending || !queue.length) return; sending = true;
  const q = queue.shift(), el = () => document.getElementById('saved');
  try {
    const r = await fetch('/api/pick', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(q)});
    const j = await r.json().catch(() => ({}));
    if (r.ok && j.record) { picks[j.id] = j.record; if (el()) { el().textContent = 'Saved'; el().className = 'saved ok'; } }
    else if (j.error === 'locked') { if (el()) { el().textContent = 'That game has kicked off, so picks are locked.'; el().className = 'saved bad'; } }
    else throw new Error(j.error || r.status);
  } catch (err) {
    queue.unshift(q);
    if (el()) { el().textContent = 'Not saved yet: no connection. It will retry.'; el().className = 'saved bad'; }
    sending = false; setTimeout(pump, 4000); return;
  }
  sending = false; if (queue.length) pump();
}

function summary(){
  mode = 'summary';
  const all = games.map(([gid, e], j) => {
    const p = mine()[gid] || {}, lock = started(e), ok = p.s && p.t;
    const txt = p.s || p.t ? `${p.s ? side(e, p.s) : '—'} · ${p.t ? (p.t === 'over' ? 'Over ' : 'Under ') + e.total : '—'}` : 'Not picked';
    return `<button type="button" class="rv${lock ? ' locked' : ''}${!ok && !lock ? ' miss' : ''}" data-j="${j}"${lock ? ' disabled' : ''}>
      <b>${esc(e.away)} @ ${esc(e.home)}</b><span>${lock ? 'Kicked off · locked' : esc(fmtKo(e.kickoff))}</span><em>${esc(txt)}</em></button>`;
  }).join('');
  const missing = open().filter(([g]) => !filled(g)).length;
  shell(`<div class="card"><div>
      ${missing ? `<h1>Almost there</h1><p class="lead">${missing} game${missing === 1 ? ' still needs' : 's still need'} a pick. Tap one to finish it.</p>`
                : `<div class="done-mark" aria-hidden="true">&#10003;</div><h1>Your picks are in, ${esc(me)}.</h1><p class="lead">Tap any game to change it before kickoff. Everyone&#8217;s picks, the model&#8217;s and the standings are on the dashboard.</p>`}
    </div>
    <div class="review">${all}</div>
    <div class="nav"><a class="btn wide" style="display:grid;place-items:center;text-decoration:none" href="/#pickem">See everyone&#8217;s picks</a></div></div>`, true);
  app.querySelectorAll('.rv[data-j]').forEach(b => b.onclick = () => { if (b.disabled) return; i = +b.dataset.j; game(); });
}

async function boot(){
  try {
    const [s, p] = await Promise.all([fetch('/api/slate', {cache: 'no-store'}).then(r => r.json()), fetch('/api/picks', {cache: 'no-store'}).then(r => r.json())]);
    PK = s.pickem; picks = p.picks || {};
    const weeks = Object.keys((PK && PK.weeks) || {}).sort();
    if (!weeks.length) throw new Error('no weeks');
    const want = wParam ? `${s.season}-${String(+wParam).padStart(2, '0')}` : null;
    wk = want && PK.weeks[want] ? want
       : weeks.find(w => Object.values(PK.weeks[w].games).some(e => e.spread != null && !started(e))) || weeks[weeks.length - 1];
    games = Object.entries(PK.weeks[wk].games).filter(([, e]) => e.spread != null).sort((a, b) => koDate(a[1].kickoff) - koDate(b[1].kickoff));
    if (!me) chooseWho(); else intro();
  } catch (err) {
    app.innerHTML = `<h1>Can&#8217;t load the games</h1><p class="lead">Check your connection and reload this page.</p>`;
  }
}
boot();
})();
</script>
</body></html>
